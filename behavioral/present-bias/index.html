<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Discount Functions Interactive Plot</title>
</head>
<body>

<h2>Discount Functions</h2>
<svg id="discountPlot" width="600" height="450"></svg>

<div style="font-size: 18px; margin-top: 10px;">
  δ = <span id="deltaval">0.944</span>
  <input id="deltaSlider" type="range" min="0.85" max="0.99" step="0.001" value="0.944">
</div>
<div style="font-size: 18px; margin-top: 10px;">
  α = <span id="discountAlphaval">4.00</span>
  <input id="discountAlphaSlider" type="range" min="0.1" max="8" step="0.1" value="4">
</div>
<div style="font-size: 18px; margin-top: 10px;">
  γ = <span id="gammaval">1.00</span>
  <input id="gammaSlider" type="range" min="0.1" max="3" step="0.1" value="1">
</div>
<div style="font-size: 18px; margin-top: 10px;">
  β = <span id="discountBetaval">0.70</span>
  <input id="discountBetaSlider" type="range" min="0.3" max="1" step="0.01" value="0.7">
</div>

<script>
const discountSvg = document.getElementById("discountPlot");
const deltaSlider = document.getElementById("deltaSlider");
const discountAlphaSlider = document.getElementById("discountAlphaSlider");
const gammaSlider = document.getElementById("gammaSlider");
const discountBetaSlider = document.getElementById("discountBetaSlider");
const deltaval = document.getElementById("deltaval");
const discountAlphaval = document.getElementById("discountAlphaval");
const gammaval = document.getElementById("gammaval");
const discountBetaval = document.getElementById("discountBetaval");

const width = 600;
const height = 450;
const margin = 50;
const plotW = width - 2 * margin;
const plotH = height - 2 * margin;
const tMax = 60;

function discountXScale(t) {
  return margin + (t / tMax) * plotW;
}

function discountYScale(y) {
  return height - margin - y * plotH;
}

function expDiscount(t, delta) {
  return Math.pow(delta, t);
}

function genHypDiscount(t, alpha, gamma) {
  return Math.pow(1 + alpha * t, -gamma / alpha);
}

function quasiHypDiscount(t, beta, delta) {
  if (t === 0) return 1;
  return beta * Math.pow(delta, t);
}

function makeDiscountPath(fn) {
  let d = "";
  for (let i = 0; i <= 1000; i++) {
    const t = (tMax * i) / 1000;
    const x = discountXScale(t);
    const y = discountYScale(fn(t));
    d += (i === 0 ? "M" : "L") + x + "," + y + " ";
  }
  return d;
}

function drawDiscount(delta, alpha, gamma, beta) {
  discountSvg.innerHTML = "";
  discountSvg.setAttribute("viewBox", `0 0 ${width} ${height}`);

  // axes
  discountSvg.innerHTML += `<line x1="${discountXScale(0)}" y1="${discountYScale(0)}" x2="${discountXScale(tMax)}" y2="${discountYScale(0)}" stroke="black" stroke-width="1.2"/>`;
  discountSvg.innerHTML += `<line x1="${discountXScale(0)}" y1="${discountYScale(0)}" x2="${discountXScale(0)}" y2="${discountYScale(1)}" stroke="black" stroke-width="1.2"/>`;

  // functions: Matplotlib default colors
  discountSvg.innerHTML += `<path d="${makeDiscountPath(t => expDiscount(t, delta))}" fill="none" stroke="#1f77b4" stroke-width="3"/>`;
  discountSvg.innerHTML += `<path d="${makeDiscountPath(t => genHypDiscount(t, alpha, gamma))}" fill="none" stroke="#ff7f0e" stroke-width="3"/>`;
  discountSvg.innerHTML += `<path d="${makeDiscountPath(t => quasiHypDiscount(t, beta, delta))}" fill="none" stroke="#2ca02c" stroke-width="3"/>`;

  // jump in quasi-hyperbolic discounting
  discountSvg.innerHTML += `<line x1="${discountXScale(0)}" y1="${discountYScale(beta)}" x2="${discountXScale(0)}" y2="${discountYScale(1)}" stroke="black" stroke-width="1.2" stroke-dasharray="8,6"/>`;

  // labels
  discountSvg.innerHTML += `<text x="${width/2}" y="${height-10}" text-anchor="middle" font-size="18">t</text>`;
  discountSvg.innerHTML += `<text x="18" y="${height/2}" text-anchor="middle" font-size="18" transform="rotate(-90, 18, ${height/2})">D(t)</text>`;

  // inline labels
  discountSvg.innerHTML += `<text x="${discountXScale(44)}" y="${discountYScale(expDiscount(44, delta)) - 8}" font-size="14" fill="#1f77b4">exponential</text>`;
  discountSvg.innerHTML += `<text x="${discountXScale(43)}" y="${discountYScale(genHypDiscount(43, alpha, gamma)) - 8}" font-size="14" fill="#ff7f0e">hyperbolic</text>`;
  discountSvg.innerHTML += `<text x="${discountXScale(32)}" y="${discountYScale(quasiHypDiscount(32, beta, delta)) + 18}" font-size="14" fill="#2ca02c">quasi-hyperbolic</text>`;
}

function updateDiscount() {
  const delta = parseFloat(deltaSlider.value);
  const alpha = parseFloat(discountAlphaSlider.value);
  const gamma = parseFloat(gammaSlider.value);
  const beta = parseFloat(discountBetaSlider.value);

  deltaval.textContent = delta.toFixed(3);
  discountAlphaval.textContent = alpha.toFixed(2);
  gammaval.textContent = gamma.toFixed(2);
  discountBetaval.textContent = beta.toFixed(2);

  drawDiscount(delta, alpha, gamma, beta);
}

drawDiscount(0.944, 4.0, 1.0, 0.7);

deltaSlider.addEventListener("input", updateDiscount);
discountAlphaSlider.addEventListener("input", updateDiscount);
gammaSlider.addEventListener("input", updateDiscount);
discountBetaSlider.addEventListener("input", updateDiscount);
</script>

</body>
</html>
